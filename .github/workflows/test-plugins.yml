name: Test plugins

on:
  push:
    branches:
      - main
  schedule:
    # GitHub Actions schedules use UTC. Hourly, offset from the top of the hour
    # and from the nightly metadata refresh at 01:30.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of backlog test suites (up to 10)
        required: false
        default: "5"
      plugins:
        description: Comma-separated plugin names to test instead of the backlog (up to 10)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: plugin-test-batch
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.select.outputs.has_work }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Refresh named plugin metadata
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.plugins != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLUGIN_NAMES: ${{ github.event.inputs.plugins }}
        run: >-
          uv run --no-project python update_plugins.py
          --package-names "$PLUGIN_NAMES"
          --selected-output named-plugins.json

      - name: Upload named plugin metadata
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.plugins != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: named-plugin-metadata
          path: named-plugins.json
          if-no-files-found: error
          retention-days: 7

      - name: Select plugin combinations
        id: select
        env:
          LIMIT: ${{ github.event.inputs.limit || '5' }}
          PLUGIN_NAMES: ${{ github.event.inputs.plugins || '' }}
        run: >-
          uv run --no-project python select_test_matrix.py
          --limit "$LIMIT"
          --plugin-names "$PLUGIN_NAMES"
          --github-output "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: ${{ needs.plan.outputs.has_work == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # Playwright browser builds are large; share them between jobs and runs.
      # The directory is versioned per browser build, so restoring the most
      # recent cache and letting `playwright install` add anything missing is
      # safe.
      - name: Restore Playwright browsers
        id: playwright-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-
          restore-keys: playwright-${{ runner.os }}-

      - name: Run released plugin tests
        run: >-
          uv run --no-project python run_plugin_tests.py
          "${{ matrix.package }}"
          --package-version "${{ matrix.package_version }}"
          --datasette-version "${{ matrix.datasette_version }}"
          --repository "${{ matrix.repository }}"
          --results-dir staged-results

      - name: Compute Playwright cache key
        id: playwright-key
        if: ${{ always() }}
        run: |
          dir="$HOME/.cache/ms-playwright"
          if [ -d "$dir" ] && [ -n "$(ls -A "$dir")" ]; then
            hash=$(ls "$dir" | sort | sha256sum | cut -c1-16)
            echo "key=playwright-${{ runner.os }}-$hash" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Playwright browsers
        if: >-
          ${{ always()
          && steps.playwright-key.outputs.key != ''
          && steps.playwright-key.outputs.key != steps.playwright-restore.outputs.cache-matched-key }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-key.outputs.key }}

      - name: Upload test result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: >-
            result-${{ matrix.package }}-${{ matrix.package_version }}-datasette-${{ matrix.datasette_version }}
          path: staged-results
          if-no-files-found: error
          retention-days: 7

  merge:
    needs:
      - plan
      - test
    if: ${{ always() && needs.plan.outputs.has_work == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: repository-writes
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          path: incoming-results

      - name: Merge metadata and immutable results
        run: |
          git pull --ff-only
          if test -f incoming-results/named-plugin-metadata/named-plugins.json; then
            uv run --no-project python update_plugins.py \
              --merge-records incoming-results/named-plugin-metadata/named-plugins.json
          fi
          uv run --no-project python merge_test_results.py incoming-results \
            --commit-message "$RUNNER_TEMP/commit-message.txt"

      - name: Commit and push results
        run: |
          git add plugins.json results
          if git diff --cached --quiet; then
            echo "Test results are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push
